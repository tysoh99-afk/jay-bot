[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaytrade"
version = "0.1.0"
description = "Read-only FXPesa MetaTrader 5 connection and signal starter"
requires-python = ">=3.10"
dependencies = [
	"MetaTrader5>=5.0.45,<6",
	"python-dotenv>=1,<2",
	"fastapi>=0.115,<1",
	"uvicorn[standard]>=0.30,<1",
	"openai>=1.50,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
